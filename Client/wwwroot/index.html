<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Jev Man</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="thejevman.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        window.focusAlternative = (id) => {
            const el = document.getElementById(id);
            if (el) el.focus();
        };

        document.addEventListener('paste', (e) => {
            const target = e.target;
            if (target && target.id && target.id.startsWith('alt-')) {
                const text = (e.clipboardData || window.clipboardData).getData('text');
                if (text && text.includes('\n')) {
                    e.preventDefault();
                    const index = parseInt(target.id.slice(4), 10);
                    DotNet.invokeMethodAsync('thejevman.Client', 'HandleAlternativePaste', index, text);
                }
            }
        });
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
